# LLM 백엔드 overlay(api): 게이트웨이가 https API로 나간다. 요청마다 제공자 고정(order=전체 slug)·
# fallback 끔·요청 파라미터 전부 지원 필수·샘플링을 넣고, seal 뒤 generation 조회로 응답 제공자를 확인한다(평가 프로토콜 §2·§6).
# API 키는 비밀 env 파일에서 게이트웨이 컨테이너에만 들어간다. 엔진·계측기에는 주지 않는다.

services:
  eval-llm-gw:
    command:
      - -role=llm-gateway
      - -backend=api
      - -listen=:${EVAL_LLM_GW_PORT:?}
      - -upstream=${EVAL_LLM_UPSTREAM:?}
      - -allow-path=${EVAL_LLM_CHAT_PATH:?}
      - -log-dir=/evidence
      - -provider=${EVAL_LLM_PROVIDER:?}
      # 엔진은 샘플링을 보내지 않으므로 선언값을 게이트웨이가 요청마다 넣는다(엔진이 보내면 거부).
      - -sampling=${EVAL_LLM_SAMPLING:?}
      - -generation-path=${EVAL_LLM_GENERATION_PATH:?}
      - -verify-attempts=${EVAL_LLM_VERIFY_ATTEMPTS:?}
      - -verify-interval=${EVAL_LLM_VERIFY_INTERVAL:?}
    environment:
      EVAL_LLM_API_KEY: ${EVAL_LLM_API_KEY:?}
    volumes:
      # 계측기 이미지는 scratch라 TLS 신뢰 묶음이 없다. 호스트 묶음을 Go 기본 경로에 읽기 전용으로 둔다.
      - ${EVAL_CA_BUNDLE:?}:/etc/ssl/certs/ca-certificates.crt:ro
