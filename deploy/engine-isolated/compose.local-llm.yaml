# LLM 백엔드 overlay(local): 같은 머신의 로컬 LLM 서버를 쓸 때만 붙인다(평가 기본은 api).
# 게이트웨이가 본문을 고치지 않고 회차와 무관한 고정 IP의 로컬 서버로 전달한다. 키는 없다
# (게이트웨이는 local에서 키 환경변수가 있으면 시작하지 않는다). compose의 host-gateway는 Docker
# 엔진마다 다른 주소로 풀리므로 쓰지 않고, 고정 IP를 설정값으로 준다. LLM 서버는 그 IP에만 바인딩한다.

services:
  eval-llm-gw:
    command:
      - -role=llm-gateway
      - -backend=local
      - -listen=:${EVAL_LLM_GW_PORT:?}
      - -upstream=${EVAL_LLM_UPSTREAM:?}
      - -allow-path=${EVAL_LLM_CHAT_PATH:?}
      - -log-dir=/evidence
    extra_hosts:
      - "${EVAL_LLM_HOSTNAME:?}:${EVAL_LLM_HOST_IP:?}"
