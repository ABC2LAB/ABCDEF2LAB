# 브라우저 수용시험 회차(러너 설정 purpose=browser_acceptance)에서만 러너가 compose.eval.yaml 뒤에 얹는다.
# 계측기가 전달한 요청의 경로를 가려 engine-paths.jsonl에 남긴다(docs/evaluation/browser-acceptance.md §6).
# 공식 회차에는 얹지 않는다(러너가 거부하고, 경로 기록이 생기면 회차가 무효다).
# compose의 command는 덮어쓰기라 기본 명령 전체를 다시 적는다. 기본 명령과 같은지는 시험으로 고정한다.
# 키 파일은 러너 uid 소유·0600·32바이트이고 회차 디렉터리 밖에 둔다. 계측기에는 읽기 전용으로만 준다.
# 긴 문법을 쓴다. 짧은 문법은 경로의 `:`에서 잘못 나뉘고, 파일이 없으면 데몬이 그 자리에 디렉터리를 만든다.
services:
  eval-meter:
    command:
      - -role=engine
      - -listen=:${EVAL_METER_PORT:?}
      - -upstream=http://target:${EVAL_TARGET_PORT:?}
      - -log-dir=/evidence
      - -drain-grace=${EVAL_METER_DRAIN_GRACE:?}
      - -path-log
      - -path-key-file=/run/eval-path-key
    volumes:
      - type: bind
        source: ${EVAL_PATH_KEY_FILE:?경로 가림 키 파일을 설정하세요}
        target: /run/eval-path-key
        read_only: true
        bind:
          create_host_path: false
