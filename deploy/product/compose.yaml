name: abc2lab-product
x-product: &product
  image: abc2lab-product:${PRODUCT_TAG:-local}
  build:
    context: ../..
    dockerfile: deploy/product/Dockerfile
    args:
      VCS_REF: ${PRODUCT_SOURCE_SHA:?set the exact product source commit}
# 탐색 브라우저 샌드박스 두 컨테이너가 같은 이미지(Dockerfile explore-browser 단계)와 격리 조건을 쓴다.
# `--profile exploration`일 때만 렌더링되며 기본으로는 켜지지 않는다(CLAUDE.md 절대 규칙 1).
x-explore-browser: &explore-browser
  image: abc2lab-explore-browser:${PRODUCT_TAG:-local}
  build:
    context: ../..
    dockerfile: deploy/product/Dockerfile
    target: explore-browser
    args:
      VCS_REF: ${PRODUCT_SOURCE_SHA:?set the exact product source commit}
  profiles: [exploration]
  user: '1000:1000'
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: 'no'
services:
  postgres:
    image: postgres:16-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: abc2lab
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks:
      control: {ipv4_address: 172.31.252.10}
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, abc2lab]
      interval: 2s
      timeout: 2s
      retries: 30
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  install:
    <<: *product
    user: '0:0'
    entrypoint: [/app/product-install-entrypoint]
    depends_on:
      postgres: {condition: service_healthy}
    secrets: [product_install, postgres_password]
    volumes: [product-state:/p]
    tmpfs: ['/tmp:rw,nosuid,nodev,size=16m']
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    networks: [control]
    restart: 'no'
  preparation:
    <<: *product
    user: '1000:1000'
    entrypoint: [/app/product-preparation-entrypoint]
    depends_on:
      install: {condition: service_completed_successfully}
    volumes: [product-state:/p]
    tmpfs: ['/tmp:rw,nosuid,nodev,size=64m']
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp-preparation.json
    pids_limit: 256
    mem_limit: 2g
    networks:
      control: {ipv4_address: 172.31.252.12}
      target: {ipv4_address: 172.31.253.12}
      # workbench는 이 주소에만 리슨한다. 엔진이 탐색 제어망(explore_control)에 붙어도 그 망에는 포트가 열리지 않게 한다
      # (docs/contracts/exploration-boundary.md §9-1). 호스트 공개는 아래 ports 그대로다.
      frontend: {ipv4_address: 172.31.250.12}
      # 탐색 단계에서 브라우저 샌드박스의 MCP(http://explore-mcp:<포트>/)로 나가기만 한다. 이 망에 리슨은 없다
      # (위 workbench 고정 주소, preparation·api는 127.0.0.1). 탐색 실행기 결정안 §3-1.
      explore_control: {}
    ports: ['127.0.0.1:${PRODUCT_PORT:-8787}:8787']
    healthcheck:
      test: [CMD, test, -S, /p/ipc/preparation.sock]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
    stop_grace_period: 60s
  api:
    <<: *product
    user: '1000:1000'
    entrypoint: [/app/first-controlled-diagnosis]
    command: [serve-url-api, -installation, /p/config/installation.json, -config, /p/config/api-launch.json, -socket, /p/ipc/preparation.sock, -runtime-api-origin, 'http://127.0.0.1:28080', -product-ui, -credential-dsn-file, /p/config/model-writer.dsn]
    depends_on:
      preparation: {condition: service_healthy}
    network_mode: service:preparation
    volumes:
      - type: volume
        source: product-state
        target: /p
        read_only: true
        volume: {subpath: api, nocopy: true}
      - type: volume
        source: product-state
        target: /p/ipc
        read_only: true
        volume: {subpath: ipc, nocopy: true}
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=16m']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    healthcheck:
      test: [CMD, curl, --fail, --silent, 'http://127.0.0.1:28081/api/product/health']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    stop_grace_period: 30s
  workbench:
    <<: *product
    user: '1000:1000'
    entrypoint: [/app/first-controlled-diagnosis]
    command: [product-front, -listen, '172.31.250.12:8787', -api-origin, 'http://127.0.0.1:28081']
    depends_on:
      api: {condition: service_healthy}
    network_mode: service:preparation
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    healthcheck:
      test: [CMD, curl, --fail, --silent, 'http://172.31.250.12:8787/api/product/health']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  # 탐색 브라우저 샌드박스(docs/contracts/exploration-boundary.md §5·§9-1 분리 배치). 탐색 경계(explore-boundary)와
  # 엔진 쪽 MCP 연결이 들어오기 전에는 켜지 않는다(`--profile exploration`일 때만 렌더링된다).
  # Chromium(explore-browser)과 MCP(explore-mcp)를 다른 network namespace에 둔다. 같은 namespace의 native 자식이
  # 제어망 주소의 MCP 포트에 닿던 B16(docs/evaluation/p1-browser-fixture-results.md)을 배치로 막기 위해서다.
  # Chromium은 브라우저 입구망과 CDP 연결망에만, MCP는 제어망과 CDP 연결망에만 붙는다.
  explore-browser:
    <<: *explore-browser
    entrypoint: [/app/explore-browser-entrypoint]
    # 실행기 옵션은 이 둘뿐이다(deploy/product/explore-chromium.js). Chromium 기본 옵션은 실행기에 고정돼 있다.
    # --cdp-listen 주소는 아래 explore_cdp 고정 주소와 같아야 하고, MCP의 --cdp-endpoint가 그 주소로 붙는다.
    command:
      - --proxy-server
      - ${EXPLORE_BROWSER_PROXY:-http://explore-boundary:3128}
      - --cdp-listen
      - 172.31.255.20:${EXPLORE_BROWSER_CDP_PORT:-9222}
    networks:
      explore_browser_ingress: {}
      explore_cdp: {ipv4_address: 172.31.255.20}
    volumes:
      - type: volume
        source: explore-ca
        target: /run/explore-ca
        read_only: true
    tmpfs: ['/tmp:rw,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=0700', '/home/node:rw,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700']
    shm_size: 256m
    pids_limit: 512
    mem_limit: 2g
  # --host·--port·--allowed-hosts는 한 묶음이다. --host는 아래 제어망 주소와 같아야 하고, 엔진은
  # http://explore-mcp:<포트>/로 붙는다. --cdp-endpoint는 explore-browser의 CDP 연결망 주소다. 이름이 아니라 IP로 붙는다.
  # Chromium DevTools가 IP·localhost가 아닌 Host 헤더를 거부하기 때문이다.
  # 이 묶음 밖의 MCP 옵션은 넣지 않는다(계약 §5.1).
  explore-mcp:
    <<: *explore-browser
    entrypoint: [/app/explore-mcp-entrypoint]
    command:
      - --headless
      - --isolated
      - --no-webmcp
      - --browser
      - chromium
      - --proxy-server
      - ${EXPLORE_BROWSER_PROXY:-http://explore-boundary:3128}
      - --cdp-endpoint
      - http://172.31.255.20:${EXPLORE_BROWSER_CDP_PORT:-9222}
      - --output-dir
      - /tmp/mcp-output
      - --port
      - ${EXPLORE_BROWSER_MCP_PORT:-8931}
      - --host
      - 172.31.254.20
      - --allowed-hosts
      - explore-mcp:${EXPLORE_BROWSER_MCP_PORT:-8931}
    depends_on:
      explore-browser: {condition: service_started}
    networks:
      explore_control: {ipv4_address: 172.31.254.20}
      explore_cdp: {ipv4_address: 172.31.255.30}
    tmpfs: ['/tmp:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0700', '/home/node:rw,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700']
    pids_limit: 256
    mem_limit: 1g
secrets:
  product_install:
    file: ${PRODUCT_INSTALL_FILE:?protected product install JSON}
  postgres_password:
    file: ${PRODUCT_POSTGRES_PASSWORD_FILE:?protected postgres password file}
networks:
  control:
    internal: true
    ipam:
      config: [{subnet: 172.31.252.0/24}]
  target:
    internal: true
    ipam:
      config: [{subnet: 172.31.253.0/24}]
  frontend:
    ipam:
      config: [{subnet: 172.31.250.0/24}]
  # 엔진(MCP 클라이언트)과 MCP 컨테이너(explore-mcp)만 붙는 제어망. 엔진은 이 망에서 포트를 열지 않는다(계약 §9-1).
  explore_control:
    internal: true
    ipam:
      config: [{subnet: 172.31.254.0/24}]
  # Chromium 컨테이너(explore-browser)와 탐색 경계의 브라우저 입구만 붙는 망.
  explore_browser_ingress:
    internal: true
  # Chromium 컨테이너와 MCP 컨테이너만 붙는 CDP 연결망. Chromium의 CDP 중계는 이 망 주소에만 리슨한다.
  explore_cdp:
    internal: true
    ipam:
      config: [{subnet: 172.31.255.0/24}]
volumes:
  postgres-data: {}
  product-state: {}
  # 탐색 경계가 CA 인증서(공개 부분)만 쓰는 볼륨. 브라우저 샌드박스는 읽기만 한다.
  explore-ca: {}
