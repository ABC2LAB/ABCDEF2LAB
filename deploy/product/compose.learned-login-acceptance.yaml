# 소유 일회용 학습 로그인 합성 전용이다(모델 로그인 계약 §6-1 배운 로그인 방법 · §6-2 확정 단계 재사용).
# compose.acceptance.yaml · compose.practice-vampi.yaml 뒤에 둔다. 탐색 수용 overlay는 얹지 않는다: 이 합성 모델은 탐색 도구를
# 다루지 않으므로 회차가 크롤 경로로 돈다. 같은 설치에서 학습 회차(모델이 Worker에서 직접 로그인해 방법을 배움) → 재사용
# 회차(확정 단계가 배운 방법으로 다시 로그인) 순서로 돌린다. 로그인은 Worker Bash → E② 경로로만 나가고, 자격은 제품에 등록한
# 계정의 Worker 지침 줄에서만 읽는다. 여기에는 대상 로그인 모양만 둔다(VAmPI 경로 · 칸 이름은
# docs/evaluation/e3-vampi-acceptance.md §4, 신원 경로는 scripts/eval/e3_vampi/declaration.json).
services:
  synthetic-model:
    command: [-mode, workflow-login-model, -login-path, /users/v1/login, -identity-path, /me, -username-field, username, -password-field, password, -token-field, auth_token, -session-header, Authorization, -session-prefix, 'Bearer ']
