services:
  postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    networks: [app_db]

  artex:
    image: abc2lab:${ABC2LAB_IMAGE_TAG:-local}
    build:
      context: .
      args:
        VCS_REF: ${ABC2LAB_SOURCE_SHA:-dev}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ARTEX_LLM_POLICY_MODE: local-only
      ARTEX_LLM_PIN_MANIFEST: /app/policy/model-policy.json
      ARTEX_SETUP_TOKEN: ${ARTEX_SETUP_TOKEN:?보호된 .env에 ARTEX_SETUP_TOKEN을 설정하세요}
      ARTEX_SKILL_DIR: /app/skills
    volumes:
      - appdata:/app/data
      - keys:/app/keys
      - skills:/app/skills
      - type: bind
        source: ${ABC2LAB_POLICY_DIR:?레포 밖의 보호된 manifest 디렉터리를 설정하세요}
        target: /app/policy
        read_only: true
    ports:
      - "127.0.0.1:8787:8787"
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    init: true
    security_opt: [no-new-privileges:true]
    networks: [app_db]

networks:
  app_db: {}

volumes:
  pgdata: {}
  appdata: {}
  keys: {}
  skills: {}
