title: ARTEX Platform Guard Audit-Log Framing
id: 3add497e-36cb-47c4-8993-df8f98585ef7
status: experimental
description: |
    Detects current and historical ARTEX platform-control framing in model-facing blocked
    tool results and retained session or legacy audit artifacts. Current audit rows store
    the display reason separately and need not contain this marker. A match supports host
    triage; it does not prove a tool executed or a request reached a target.
references:
    - https://github.com/jiwoochris/artex-global/blob/main/docs/defense-ko.md
    - https://github.com/jiwoochris/artex-global/blob/main/docs/defense-en.md
    - https://github.com/jiwoochris/artex-global
author: artex-global defense guide
date: 2026-10-05
tags:
    - attack.execution
    - attack.t1059
logsource:
    category: application
detection:
    keywords:
        - '[ARTEX PLATFORM CONTROL - NOT TARGET DEFENSE]'
        - '【ARTEX 平台管控·非目标防御】'
    condition: keywords
falsepositives:
    - Logs that quote this defense guide or the ARTEX source code for documentation purposes.
level: high
